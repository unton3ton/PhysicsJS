<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Релятивистский обмен фотонами между электронами</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    margin: 16px;
  }

  canvas {
    background: #000;
    border: 1px solid #333;
    display: block;
    margin: 8px 0;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    margin-bottom: 8px;
  }

  label {
    font-size: 14px;
  }

  input[type="range"] {
    vertical-align: middle;
  }
</style>
</head>
<body>

<h2>Toy-модель: релятивистские электроны и обмен фотонами</h2>

<div class="controls">
  <label>
    v₀/c:
    <input id="v0" type="range" min="0.10" max="0.95" step="0.01" value="0.55">
    <span id="v0Val">0.55</span>
  </label>

  <label>
    coupling:
    <input id="coupling" type="range" min="100" max="2000" step="10" value="650">
    <span id="couplingVal">650</span>
  </label>

  <label>
    импульс фотона:
    <input id="dp" type="range" min="0.005" max="0.060" step="0.001" value="0.022">
    <span id="dpVal">0.022</span>
  </label>

  <label>
    шагов/кадр:
    <input id="steps" type="range" min="1" max="100" step="1" value="20">
    <span id="stepsVal">20</span>
  </label>

  <button id="pause">Пауза</button>
  <button id="reset">Сброс</button>
</div>

<canvas id="c" width="900" height="320"></canvas>
<div id="info"></div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

const v0El = document.getElementById("v0");
const v0Val = document.getElementById("v0Val");

const couplingEl = document.getElementById("coupling");
const couplingVal = document.getElementById("couplingVal");

const dpEl = document.getElementById("dp");
const dpVal = document.getElementById("dpVal");

const stepsEl = document.getElementById("steps");
const stepsVal = document.getElementById("stepsVal");

const pauseBtn = document.getElementById("pause");
const resetBtn = document.getElementById("reset");

// -----------------------------------------------
// Единицы: c = 1, m_e = 1
// -----------------------------------------------
const C = 1.0;
const M = 1.0;

const dt = 0.01;

let stepsPerFrame = +stepsEl.value;
let running = true;
let time = 0;

let v0 = +v0El.value;
let coupling = +couplingEl.value;
let photonDP = +dpEl.value;

// Параметры излучения/обмена
const soft = 5.0;
const emitRadius = 65.0;

// Маленькое мягкое ядро, чтобы частицы не проходили ровно через друг друга,
// если фотонного обмена недостаточно. Это численная регуляризация.
const coreStrength = 0.8;
const coreSoft = 0.5;

let emitAccum = 0;

let particles = [];
let photons = [];

// -----------------------------------------------
// Релятивистская механика
// -----------------------------------------------

function pFromV(v) {
  return M * v / Math.sqrt(1 - (v * v) / (C * C));
}

function vFromP(p) {
  return p * C / Math.sqrt(M * M * C * C + p * p);
}

function gammaFromP(p) {
  return Math.sqrt(1 + (p * p) / (M * M * C * C));
}

// -----------------------------------------------
// Инициализация
// -----------------------------------------------

function reset() {
  particles = [
    {
      x: -38,
      p: pFromV(+v0),
      color: "#00e5ff"
    },
    {
      x: +38,
      p: pFromV(-v0),
      color: "#ff9f43"
    }
  ];

  photons = [];
  time = 0;
  emitAccum = 0;
}

// -----------------------------------------------
// Испускание фотонной пары
//
// Левый электрон испускает фотон вправо и получает отдачу влево.
// Правый электрон испускает фотон влево и получает отдачу вправо.
// Это даёт отталкивание и сохраняет полный импульс системы.
// -----------------------------------------------

function emitPair() {
  if (photons.length > 800) return;

  const i = particles[0].x <= particles[1].x ? 0 : 1;
  const j = 1 - i;

  const left = particles[i];
  const right = particles[j];

  const dp = photonDP;

  // left -> right
  photons.push({
    x: left.x,
    dir: +1,
    pvec: +dp,
    target: j,
    born: time
  });

  left.p -= dp;

  // right -> left
  photons.push({
    x: right.x,
    dir: -1,
    pvec: -dp,
    target: i,
    born: time
  });

  right.p += dp;
}

// -----------------------------------------------
// Шаг симуляции
// -----------------------------------------------

function step(h) {
  time += h;

  const dx = particles[1].x - particles[0].x;
  const d = Math.abs(dx);
  const s = Math.sign(dx) || 1;

  // Мягкое численное ядро, предотвращает точное наложение частиц.
  const coreF = coreStrength / (d * d + coreSoft * coreSoft);

  particles[0].p += -s * coreF * h;
  particles[1].p += +s * coreF * h;

  const v1 = vFromP(particles[0].p);
  const v2 = vFromP(particles[1].p);

  // Фотоны испускаются, когда электроны сближаются.
  const approaching = dx * (v2 - v1) < 0;

  if (d < emitRadius && approaching) {
    // Интенсивность обмена растёт при уменьшении расстояния.
    const rate = coupling / (d * d + soft * soft);

    emitAccum += rate * h;

    while (emitAccum >= 1) {
      emitAccum -= 1;
      emitPair();
    }
  } else if (d >= emitRadius) {
    emitAccum = 0;
  }

  // Полёт фотонов и поглощение
  for (let k = photons.length - 1; k >= 0; k--) {
    const ph = photons[k];

    ph.x += ph.dir * C * h;

    const target = particles[ph.target];

    const reached =
      (ph.dir > 0 && ph.x >= target.x) ||
      (ph.dir < 0 && ph.x <= target.x);

    if (reached) {
      target.p += ph.pvec;
      photons.splice(k, 1);
    } else if (time - ph.born > 800) {
      // защита от бесконечно живущих фотонов
      photons.splice(k, 1);
    }
  }

  // Движение электронов
  for (const pt of particles) {
    pt.x += vFromP(pt.p) * h;
  }
}

// -----------------------------------------------
// Отрисовка
// -----------------------------------------------

function getViewHalf() {
  let m = 48;

  for (const p of particles) {
    m = Math.max(m, Math.abs(p.x) + 15);
  }

  for (const ph of photons) {
    m = Math.max(m, Math.abs(ph.x) + 10);
  }

  return m;
}

function xToPx(x, viewHalf) {
  return (x + viewHalf) / (2 * viewHalf) * canvas.width;
}

function drawPhoton(ph, viewHalf) {
  const px = xToPx(ph.x, viewHalf);

  // Верхняя дорожка: фотоны от левого к правому.
  // Нижняя дорожка: фотоны от правого к левому.
  const y = ph.dir > 0 ? canvas.height * 0.40 : canvas.height * 0.60;

  const phase = time * 25 + px * 0.03;

  ctx.save();

  ctx.strokeStyle = "rgba(255,220,80,0.85)";
  ctx.lineWidth = 1.3;

  ctx.beginPath();

  const len = 18;

  for (let s = 0; s <= 24; s++) {
    const t = s / 24;
    const xx = px - len / 2 + len * t;
    const yy = y + 4.5 * Math.sin(t * Math.PI * 5 + phase);

    if (s === 0) ctx.moveTo(xx, yy);
    else ctx.lineTo(xx, yy);
  }

  ctx.stroke();

  // Голова фотона
  ctx.fillStyle = "rgba(255,250,200,0.95)";
  ctx.beginPath();
  ctx.arc(px, y, 2.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticle(pt, viewHalf, label) {
  const px = xToPx(pt.x, viewHalf);
  const py = canvas.height * 0.50;

  ctx.save();

  // свечение
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = pt.color;
  ctx.beginPath();
  ctx.arc(px, py, 18, 0, Math.PI * 2);
  ctx.fill();

  // сама частица
  ctx.globalAlpha = 0.95;
  ctx.beginPath();
  ctx.arc(px, py, 6.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ddd";
  ctx.font = "12px system-ui";
  ctx.fillText(label, px - 10, py - 24);

  ctx.restore();
}

function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const viewHalf = getViewHalf();

  // ось
  ctx.strokeStyle = "#222";
  ctx.beginPath();
  ctx.moveTo(0, canvas.height * 0.5);
  ctx.lineTo(canvas.width, canvas.height * 0.5);
  ctx.stroke();

  ctx.fillStyle = "#555";
  ctx.font = "12px system-ui";

  ctx.fillText("фотоны: e₁ → e₂", 10, canvas.height * 0.40 - 12);
  ctx.fillText("фотоны: e₂ → e₁", 10, canvas.height * 0.60 + 22);

  for (const ph of photons) {
    drawPhoton(ph, viewHalf);
  }

  drawParticle(particles[0], viewHalf, "e₁");
  drawParticle(particles[1], viewHalf, "e₂");

  const d = Math.abs(particles[1].x - particles[0].x);

  const pTotal =
    particles[0].p +
    particles[1].p +
    photons.reduce((sum, ph) => sum + ph.pvec, 0);

  info.textContent =
    `t = ${time.toFixed(1)} | ` +
    `d = ${d.toFixed(1)} | ` +
    `v₁ = ${vFromP(particles[0].p).toFixed(3)}c | ` +
    `v₂ = ${vFromP(particles[1].p).toFixed(3)}c | ` +
    `γ₁ = ${gammaFromP(particles[0].p).toFixed(3)} | ` +
    `γ₂ = ${gammaFromP(particles[1].p).toFixed(3)} | ` +
    `фотонов: ${photons.length} | ` +
    `P = ${pTotal.toFixed(4)}`;
}

// -----------------------------------------------
// Цикл анимации
// -----------------------------------------------

function frame() {
  if (running) {
    for (let i = 0; i < stepsPerFrame; i++) {
      step(dt);
    }
  }

  render();
  requestAnimationFrame(frame);
}

// -----------------------------------------------
// Управление
// -----------------------------------------------

v0El.addEventListener("input", () => {
  v0 = +v0El.value;
  v0Val.textContent = v0.toFixed(2);
  reset();
});

couplingEl.addEventListener("input", () => {
  coupling = +couplingEl.value;
  couplingVal.textContent = coupling;
});

dpEl.addEventListener("input", () => {
  photonDP = +dpEl.value;
  dpVal.textContent = photonDP.toFixed(3);
});

stepsEl.addEventListener("input", () => {
  stepsPerFrame = +stepsEl.value;
  stepsVal.textContent = stepsEl.value;
});

pauseBtn.addEventListener("click", () => {
  running = !running;
  pauseBtn.textContent = running ? "Пауза" : "Старт";
});

resetBtn.addEventListener("click", reset);

reset();
requestAnimationFrame(frame);

</script>
</body>
</html>
