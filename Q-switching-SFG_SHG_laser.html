<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Количественный зелёный DPSS: скоростные уравнения + SHG + Q-switching + юстировка</title>
<style>
  html,body{background:#0b0d12;color:#dfe6f3;font-family:system-ui,Segoe UI,Arial;margin:0;padding:12px}
  h2{text-align:center;font-weight:600;margin:2px 0 8px;font-size:17px}
  .controls{display:flex;gap:13px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
  .controls label{display:flex;align-items:center;gap:5px}
  canvas{display:block;margin:0 auto;background:#05060a;border:1px solid #223;border-radius:10px}
  button,select{background:#1c2333;color:#dfe6f3;border:1px solid #35405a;border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer}
  button:hover{background:#27304a}
  #fire{background:#3a1c1c;border-color:#7a3030;color:#ffd0c0}
  #align{background:#1c3a2a;border-color:#307a50;color:#c0ffe0}
  #info{max-width:1180px;margin:8px auto 0;font-size:13px;line-height:1.5;color:#b9c6de;
        display:grid;grid-template-columns:repeat(4,1fr);gap:4px 16px}
  #info b{color:#eef3ff}
  .sub{grid-column:1/-1;color:#7f90ad;font-size:11.5px;border-top:1px solid #223;padding-top:4px}
</style>
</head>
<body>
<h2>Зелёный DPSS-лазер: скоростные уравнения · SHG (−κ·Φ²) · Q-switching · юстировка мышью</h2>
<div class="controls">
  <label>Накачка 808 нм <input id="pump" type="range" min="0" max="500" value="250"><span id="pv"></span></label>
  <label>Режим <select id="mode">
    <option value="qswitch">Q-switching (импульсы)</option>
    <option value="cw">CW (непрерывный)</option>
  </select></label>
  <label id="replab">Частота затвора <input id="rep" type="range" min="1" max="5000" value="1000"><span id="repv"></span></label>
  <button id="fire">Огнь</button>
  <label>Температура KTP <input id="temp" type="range" min="0" max="100" value="50"></label>
  <label>Скорость <input id="speed" type="range" min="0" max="100" value="45"></label>
  <label><input id="slowmo" type="checkbox" checked> замедление на импульсе</label>
  <button id="align">Выровнять оптику</button>
  <button id="pause">Пауза</button>
  <button id="reset">Сброс</button>
</div>
<canvas id="c" width="1180" height="700"></canvas>
<div id="info"></div>

<script>
'use strict';
/* ======================================================================
   КОЛИЧЕСТВЕННЫЙ DPSS 808→1064→532
   dN2/dt = Rp·η_л − N2/τf − G·N2·Φ/Vg
   dΦ/dt  = [G·N2 − 1/τc(t)]·Φ − κ·Φ² + β·N2·Vg/τf ,  G = 2σLg/t_rt
   P532   = κΦ²/2·hνg·ηg ;  κ = κ0·sinc²(ΔkL/2)·η_KTP(юстировка)
   τc(t)  = t_rt/[δpass + δюст + δQS(t)]
   Ниже порога фотонное уравнение решается квазистационарно (Φ=Ssp/|net|),
   чтобы не интегрировать жёсткую релаксацию фотонов наносекундным шагом.
   ====================================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,AXIS=190;
const hP=6.62607015e-34,cL=2.99792458e8;
const LAM_P=808e-9,LAM_L=1064e-9,LAM_G=532e-9;
const MAT={N_total:1e26,tau_f:230e-6,sigma:2.8e-23,n:1.82,alpha:0.5,beta:1e-5};
const GEO={L_g:5e-3,L_c:0.10,A:1e-8,R1:0.999};
const KAPPA0=5e-3,ETA_G=0.85,ETA_ABS=0.8,deltaQS=4.0,t_open=1e-5;
const MAX_STEPS=15000,SLOW_SIM=1.5e-10,SLOWMO_WIN=8e-6;
const R2=0.90;

let mode='qswitch',Ppump=0.250,rep=1000,tempVal=50;
let hvp,hvl,hvg,t_rt,Vg,Vc,Gcoef,dPass0,dOC,N2_th,P_th0,Wp0max;
let n2=0,phi=0,t=0;
let switchClosed=true,tOpened=0,tLastOpen=0,manualFire=false,slowmoUntil=-1;
let avgPG=0,pulseCap=null,lastPulse=null,pulseCount=0,totalE=0;
let samples=[],nextSampleT=0,t_sample=1e-6,curSpeed=2e-5;
let paused=false,autoSlow=true,pulseActive=false;
const lens={x0:148,x1:178,off:0,grab:0,half:46,name:'линза'};
const ktpE={x0:408,x1:492,off:0,grab:0,half:44,name:'KTP'};
let dragIt=null,hoverIt=null;

/* ---------- производные величины ---------- */
function recompute(){
  hvp=hP*cL/LAM_P;hvl=hP*cL/LAM_L;hvg=hP*cL/LAM_G;
  t_rt=2*(GEO.L_c+(MAT.n-1)*GEO.L_g)/cL;
  Vg=GEO.A*GEO.L_g;Vc=GEO.A*GEO.L_c;
  Gcoef=2*MAT.sigma*GEO.L_g/t_rt;
  dPass0=2*MAT.alpha*GEO.L_g+Math.log(1/(GEO.R1*R2));
  dOC=Math.log(1/R2);
  const g_th=dPass0/(2*GEO.L_g);
  N2_th=g_th/MAT.sigma;
  P_th0=(N2_th/MAT.tau_f)*hvp*Vg/ETA_ABS;
  Wp0max=ETA_ABS*0.5/(hvp*Vg);
}
/* ---------- юстировка и фазовый синхронизм ---------- */
const etaCoup=()=>Math.exp(-Math.pow(lens.off/24,2));
const etaKtp =()=>Math.exp(-Math.pow(ktpE.off/20,2));
const dAlign =()=>0.12*(Math.pow(lens.off/45,2)+Math.pow(ktpE.off/45,2));
function pmFac(){const dT=(tempVal-50)*0.36,x=dT*0.30;
  return Math.abs(x)<1e-9?1:Math.pow(Math.sin(x)/x,2);}
const kappa=()=>KAPPA0*pmFac()*etaKtp();
const curDelta=()=>dPass0+dAlign()+((mode==='qswitch'&&switchClosed)?deltaQS:0);
const Pgreen=()=>kappa()*phi*phi/2*hvg*ETA_G;
const Pcirc =()=>phi*hvl/t_rt;
const Pleak =()=>phi*hvl*dOC/t_rt;
const Wp0cur=()=>ETA_ABS*Ppump/(hvp*Vg)*etaCoup();

/* ---------- правая часть ---------- */
function deriv(n2v,phiv){
  const tau_c=t_rt/curDelta();
  const dn2=Wp0cur()-n2v/MAT.tau_f-Gcoef*n2v*phiv/Vg;
  const dphi=(Gcoef*n2v-1/tau_c)*phiv-kappa()*phiv*phiv+MAT.beta*n2v*Vg/MAT.tau_f;
  return[dn2,dphi];
}
function chooseDt(){
  const tau_c=t_rt/curDelta();
  const lam=Math.abs(Gcoef*n2-1/tau_c)+2*kappa()*phi+1/tau_c;
  let dt=0.15/Math.max(lam,1e3);
  dt=Math.min(dt,1e-6);
  return Math.max(dt,1e-13);
}
/* ---------- Q-затвор ---------- */
function updateQS(){
  if(mode!=='qswitch'){switchClosed=false;return;}
  if(switchClosed){
    if(manualFire||(t-tLastOpen)>=1/rep){
      switchClosed=false;tOpened=t;manualFire=false;
      if(autoSlow)slowmoUntil=t+SLOWMO_WIN;
    }
  }else if(t-tOpened>=t_open){switchClosed=true;tLastOpen=t;}
}
function nextEvent(){
  if(mode!=='qswitch')return null;
  return switchClosed?(manualFire?t:tLastOpen+1/rep):(tOpened+t_open);
}
/* ---------- захват импульса ---------- */
function detectPulse(){
  if(mode!=='qswitch')return;
  const P=Pgreen();
  if(!pulseCap&&P>2)pulseCap={t0:t,E:0,peak:0,lastP:P,lastT:t,s:[]};
  if(pulseCap){
    pulseCap.E+=0.5*(P+pulseCap.lastP)*(t-pulseCap.lastT);
    pulseCap.lastP=P;pulseCap.lastT=t;
    if(P>pulseCap.peak)pulseCap.peak=P;
    pulseCap.s.push([t,P]);if(pulseCap.s.length>6000)pulseCap.s.shift();
    if(P<1&&t-pulseCap.t0>5e-8){
      const half=pulseCap.peak/2;let a=null,b=null;
      for(const[x,y]of pulseCap.s){if(y>=half){if(a===null)a=x;b=x;}}
      lastPulse={E:pulseCap.E,peak:pulseCap.peak,fwhm:a!==null?b-a:null};
      pulseCount++;totalE+=pulseCap.E;pulseCap=null;
    }
  }
}
/* ---------- интегрирование ---------- */
function pushSample(){
  samples.push({t,n2,pg:Pgreen(),pc:Pcirc()});
  const tw=graphWindow();
  while(samples.length&&samples[0].t<t-tw)samples.shift();
}
function advance(dur){
  const tEnd=t+dur;let steps=0;
  while(t<tEnd&&steps<MAX_STEPS){
    updateQS();
    const ev=nextEvent();
    const tau_c=t_rt/curDelta();
    const netG=Gcoef*n2-1/tau_c;
    let dt;
    if(phi<0.5&&netG<0){
      // квазистационарный фотонный фон: быстро качаем N2
      phi=MAT.beta*n2*Vg/MAT.tau_f/(-netG);
      dt=Math.min(0.05*MAT.tau_f,1e-5,tEnd-t);
      if(ev!==null&&ev-t>1e-14)dt=Math.min(dt,ev-t);
      if(dt<=0)dt=1e-13;
      const f=x=>Wp0cur()-x/MAT.tau_f-Gcoef*x*phi/Vg;
      const k1=f(n2),k2=f(n2+.5*dt*k1),k3=f(n2+.5*dt*k2),k4=f(n2+dt*k3);
      n2+=dt/6*(k1+2*k2+2*k3+k4);
    }else{
      dt=chooseDt();
      dt=Math.min(dt,tEnd-t);
      if(ev!==null&&ev-t>1e-14)dt=Math.min(dt,ev-t);
      if(dt<=0)dt=1e-13;
      const k1=deriv(n2,phi);
      const k2=deriv(n2+.5*dt*k1[0],phi+.5*dt*k1[1]);
      const k3=deriv(n2+.5*dt*k2[0],phi+.5*dt*k2[1]);
      const k4=deriv(n2+dt*k3[0],phi+dt*k3[1]);
      n2+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
      phi+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    }
    if(n2<0)n2=0;if(n2>MAT.N_total)n2=MAT.N_total;if(phi<0)phi=0;
    avgPG+=(Pgreen()-avgPG)*Math.min(1,dt/1e-3);
    t+=dt;steps++;
    if(t>=nextSampleT){pushSample();nextSampleT+=t_sample;}
    detectPulse();
  }
}
const graphWindow=()=>mode==='qswitch'?Math.max(4/rep,1e-4):Math.min(8*MAT.tau_f,4e-3);
function reset(){
  recompute();
  n2=0;phi=0;t=0;avgPG=0;
  switchClosed=true;tOpened=0;manualFire=false;slowmoUntil=-1;
  tLastOpen=2*MAT.tau_f-1/rep;
  pulseCap=null;lastPulse=null;pulseCount=0;totalE=0;
  samples=[];nextSampleT=0;
}
/* ================= ОТРИСОВКА ================= */
function label(s,x,y,c='#8fa3c8',f='12px system-ui',al='left'){
  ctx.fillStyle=c;ctx.font=f;ctx.textAlign=al;ctx.fillText(s,x,y);ctx.textAlign='left';}
function panel(x,y,w,h){ctx.fillStyle='rgba(20,26,40,.75)';ctx.strokeStyle='#2c3a55';
  ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();}
function fmt(x,u){
  if(!isFinite(x)||x===0)return'0 '+u;
  const a=Math.abs(x),p=[['G',1e9],['M',1e6],['k',1e3],['',1],['m',1e-3],['µ',1e-6],['n',1e-9],['p',1e-12]];
  for(const[q,f]of p)if(a>=f)return(x/f).toPrecision(3)+' '+q+u;
  return(x*1e15).toPrecision(3)+' f'+u;}
function bar2(x,y,w,v,lab,col,txt){
  v=Math.max(0,Math.min(1,v));
  ctx.fillStyle='#141a28';ctx.fillRect(x,y,w,11);
  ctx.strokeStyle='#33415c';ctx.lineWidth=1;ctx.strokeRect(x,y,w,11);
  ctx.fillStyle=col;ctx.fillRect(x,y,w*v,11);
  label(lab,x,y+24,'#9fb2d4','11px system-ui');
  label(txt,x+w,y+24,'#dfe6f3','11px system-ui','right');}

function drawBench(){
  ctx.strokeStyle='rgba(90,110,140,.28)';ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.moveTo(24,AXIS);ctx.lineTo(1156,AXIS);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(140,70,70,.06)';ctx.fillRect(240,AXIS-74,320,148);
  label('оптический резонатор 1064 нм',400,AXIS-84,'#5a6c8f','11px system-ui','center');
}
function drawLD(){
  const g=Ppump/0.5;
  const gr=ctx.createLinearGradient(118,0,200,0);
  gr.addColorStop(0,`rgba(180,140,255,${.45*g})`);gr.addColorStop(1,'rgba(180,140,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(118,AXIS-10,82,20);
  ctx.fillStyle='#232b3f';ctx.strokeStyle='#4a5a7a';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(40,AXIS-22,72,44,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=`rgba(180,140,255,${.35+.6*g})`;ctx.fillRect(110,AXIS-9,7,18);
  ctx.strokeStyle='#6d84a8';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(66,AXIS-22);ctx.lineTo(66,AXIS-34);
  ctx.moveTo(86,AXIS+22);ctx.lineTo(86,AXIS+34);ctx.stroke();
  label('ЛД 808 нм',40,AXIS+100,'#cdd9ee');
}
function drawPumpRays(){
  const g=Ppump/0.5,ec=etaCoup();
  const lx=162,ly=AXIS+lens.off,fx=300,fy=AXIS+lens.off*0.7;
  ctx.strokeStyle=`rgba(180,140,255,${(0.12+0.45*g)*Math.max(0.12,ec)})`;
  ctx.lineWidth=1.4;
  for(const s of[-1,0,1]){
    ctx.beginPath();ctx.moveTo(114,AXIS+s*8);ctx.lineTo(lx,ly+s*16);
    ctx.lineTo(fx,fy+s*2.5);ctx.stroke();
  }
  ctx.fillStyle=`rgba(180,140,255,${0.4*g*Math.max(0.1,ec)})`;
  ctx.beginPath();ctx.arc(fx,fy,5,0,7);ctx.fill();
}
function drawLens(){
  const ly=AXIS+lens.off;
  if(Math.abs(lens.off)>2){
    ctx.strokeStyle='rgba(127,160,200,.35)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(162,AXIS,9,44,0,0,7);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.fillStyle='rgba(140,180,230,.28)';
  ctx.strokeStyle=(dragIt===lens||hoverIt===lens)?'#ffd76a':'#7fa0c8';
  ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(162,ly,9,44,0,0,7);ctx.fill();ctx.stroke();
  label('Линза',146,AXIS+100,'#cdd9ee');
  if(Math.abs(lens.off)>2)label('Δy='+lens.off.toFixed(0),146,AXIS+114,'#ffb14a','10px system-ui');
}
function drawMirrors(){
  let g1=ctx.createLinearGradient(228,0,240,0);
  g1.addColorStop(0,'#39445e');g1.addColorStop(1,'#d5e2f5');
  ctx.fillStyle=g1;ctx.fillRect(228,AXIS-72,12,144);
  g1=ctx.createLinearGradient(560,0,572,0);
  g1.addColorStop(0,'rgba(213,226,245,.95)');g1.addColorStop(1,'rgba(213,226,245,.35)');
  ctx.fillStyle=g1;ctx.fillRect(560,AXIS-72,12,144);
  label('HR',222,AXIS+100,'#cdd9ee');label('R(1064)≈100%',206,AXIS+114,'#7f90ad','10px system-ui');
  label('OC',556,AXIS+100,'#cdd9ee');label('R≈90%',548,AXIS+114,'#7f90ad','10px system-ui');
}
function drawNd(){
  ctx.fillStyle='rgba(96,140,220,.14)';ctx.fillRect(268,AXIS-42,84,84);
  ctx.strokeStyle='#3a4a6a';ctx.lineWidth=1.5;ctx.strokeRect(268,AXIS-42,84,84);
  const frac=Math.max(0,Math.min(1,n2/MAT.N_total));
  for(let i=0;i<48;i++){
    const ax=276+(i%8)*10,ay=AXIS-34+((i/8)|0)*10;
    const exc=(i+0.5)/48<frac;
    if(exc){ctx.fillStyle='rgba(125,255,125,.16)';
      ctx.beginPath();ctx.arc(ax,ay,8,0,7);ctx.fill();}
    ctx.fillStyle=exc?'#7dff7d':'#6d84a8';
    ctx.beginPath();ctx.arc(ax,ay,3.6,0,7);ctx.fill();
  }
  label('Nd:YAG',284,AXIS+100,'#cdd9ee');
}
function drawKTP(){
  const ky=AXIS+ktpE.off;
  if(Math.abs(ktpE.off)>2){
    ctx.strokeStyle='rgba(160,96,144,.4)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
    ctx.strokeRect(410,AXIS-36,80,72);ctx.setLineDash([]);
  }
  ctx.fillStyle='rgba(255,110,170,.13)';ctx.fillRect(410,ky-36,80,72);
  const pg=Pgreen();
  const cg=Math.max(0,Math.min(.5,Math.log10(pg+1)/6));
  if(cg>0.01){ctx.fillStyle=`rgba(120,255,150,${cg})`;
    ctx.fillRect(410,AXIS-10,80,20);}                    // область перекрытия моды
  ctx.strokeStyle=(dragIt===ktpE||hoverIt===ktpE)?'#ffd76a':'#a06090';
  ctx.lineWidth=1.6;ctx.strokeRect(410,ky-36,80,72);
  label('KTP (SHG)',424,AXIS+100,'#cdd9ee');
  label('синхронизм '+Math.round(pmFac()*100)+'%',418,AXIS+114,
        pmFac()>0.5?'#7dffa9':'#ff8a70','10px system-ui');
  if(Math.abs(ktpE.off)>2)label('Δy='+ktpE.off.toFixed(0),424,AXIS+128,'#ffb14a','10px system-ui');
}
function drawQS(){
  const closed=(mode==='qswitch'&&switchClosed);
  ctx.fillStyle=mode!=='qswitch'?'rgba(90,100,120,.25)':
    closed?'rgba(255,90,60,.8)':'rgba(90,220,140,.35)';
  ctx.fillRect(512,AXIS-34,26,68);
  ctx.strokeStyle='#4a5a7a';ctx.lineWidth=1.2;ctx.strokeRect(512,AXIS-34,26,68);
  label('Q-затвор',503,AXIS+100,'#cdd9ee');
  if(mode==='qswitch')
    label(closed?'закрыт':'ОТКРЫТ',506,AXIS+114,closed?'#ff8a70':'#7dffa9','10px system-ui');
}
function drawFilter(){
  ctx.save();ctx.translate(645,AXIS);ctx.rotate(0.10);
  ctx.fillStyle='rgba(96,150,255,.30)';ctx.strokeStyle='#7fa0ff';ctx.lineWidth=1.5;
  ctx.fillRect(-5,-64,10,128);ctx.strokeRect(-5,-64,10,128);
  ctx.restore();
  const pl=Pleak();
  if(pl>0.02){ctx.fillStyle=`rgba(255,150,60,${Math.min(.6,Math.log10(pl+1)*.5)})`;
    ctx.beginPath();ctx.arc(645,AXIS,12,0,7);ctx.fill();}
  label('ИК-фильтр',620,AXIS+100,'#cdd9ee');
  label('ИК → тепло: '+fmt(pl,'Вт'),600,AXIS+114,'#7f90ad','10px system-ui');
}
function drawIRGlow(){
  const lp=Math.max(0,Math.min(1,Math.log10(phi+1)/13));
  if(lp>0.02){
    const hgt=8+50*lp;
    const g=ctx.createLinearGradient(0,AXIS-hgt/2,0,AXIS+hgt/2);
    g.addColorStop(0,'rgba(255,60,50,0)');
    g.addColorStop(.5,`rgba(255,70,60,${.55*lp})`);
    g.addColorStop(1,'rgba(255,60,50,0)');
    ctx.fillStyle=g;ctx.fillRect(240,AXIS-hgt/2,320,hgt);
  }
}
function drawOutput(){
  const pg=Pgreen();
  const b=Math.max(0,Math.min(1,Math.log10(pg*1e3+1)/5));
  if(b>0.02){
    const g=ctx.createLinearGradient(655,0,1156,0);
    g.addColorStop(0,`rgba(82,255,125,${.85*b})`);g.addColorStop(1,'rgba(82,255,125,0)');
    const bh=3+26*b;
    ctx.fillStyle=g;ctx.fillRect(655,AXIS-bh/2,501,bh);
  }
  label('Выход 532 нм: '+fmt(avgPG,'Вт'),700,AXIS-46,'#52ff7d','13px system-ui');
}
function drawLevels(){
  panel(20,360,280,328);
  label('Ионы Nd³⁺ — 4 уровня',36,382,'#cfdaf0','13px system-ui');
  const L=[{y:412,lab:'полоса накачки',s:'p'},{y:470,lab:'⁴F₃/₂ метастабильный',s:2},
           {y:560,lab:'нижний лазерный',s:'l'},{y:642,lab:'⁴I₉/₂ основной',s:'g'}];
  const x0=36,x1=190;
  const f2=n2/MAT.N_total;
  const fr={p:0,2:f2,l:0,g:1-f2};
  for(const lv of L){
    ctx.strokeStyle='#5a6c8f';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x0,lv.y);ctx.lineTo(x1,lv.y);ctx.stroke();
    label(lv.lab,x0,lv.y-6,'#93a5c6','10px system-ui');
    const w=(x1-x0)*fr[lv.s];
    ctx.fillStyle=lv.s===2?'rgba(125,255,125,.85)':'rgba(143,180,232,.85)';
    ctx.fillRect(x0,lv.y-4,w,4);
    label((fr[lv.s]*100).toFixed(1)+'%',x1+8,lv.y+4,'#dfe6f3','11px system-ui');
  }
  const pumpA=Math.min(1,Wp0cur()/Wp0max*1.1);
  const lasA=Math.min(1,Math.log10(phi+1)/12);
  arrow(52,L[3].y,52,L[0].y,'#b48cff',pumpA,'808');
  wavy(96,L[0].y,96,L[1].y,'#ffb14a',pumpA,'τ≈нс');
  arrow(140,L[1].y,140,L[2].y,'#ff5050',lasA,'1064');
  arrow(176,L[2].y,176,L[3].y,'#7fd0ff',lasA,'быстрый');
  label('яркость стрелок ∝ скорости процессов',36,678,'#5a6c8f','10px system-ui');
}
function arrow(x1,y1,x2,y2,col,alpha,lab){
  ctx.globalAlpha=Math.max(.25,Math.min(1,alpha));
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const ang=Math.atan2(y2-y1,x2-x1),s=7;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-s*Math.cos(ang-.5),y2-s*Math.sin(ang-.5));
  ctx.lineTo(x2-s*Math.cos(ang+.5),y2-s*Math.sin(ang+.5));ctx.closePath();ctx.fill();
  if(lab){ctx.font='10px system-ui';ctx.fillText(lab,x1+5,(y1+y2)/2);}
  ctx.globalAlpha=1;}
function wavy(x1,y1,x2,y2,col,alpha,lab){
  ctx.globalAlpha=Math.max(.25,Math.min(1,alpha));
  ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.beginPath();
  for(let i=0;i<=12;i++){const t=i/12,yy=y1+(y2-y1)*t,xx=x1+Math.sin(t*Math.PI*4)*5;
    i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}
  ctx.stroke();
  if(lab){ctx.fillStyle=col;ctx.font='10px system-ui';ctx.fillText(lab,x1+7,(y1+y2)/2);}
  ctx.globalAlpha=1;}
function drawPM(){
  panel(316,360,284,160);
  label('Фазовый синхронизм KTP: sinc²(ΔkL/2)',330,380,'#cfdaf0','12px system-ui');
  const px=330,py=392,pw=256,ph=76;
  ctx.strokeStyle='#22304a';ctx.beginPath();ctx.moveTo(px,py+ph);ctx.lineTo(px+pw,py+ph);ctx.stroke();
  ctx.strokeStyle='#ffdf3f';ctx.lineWidth=1.6;ctx.beginPath();
  for(let i=0;i<=120;i++){
    const dT=-18+i*36/120,x=dT*0.30,pm=Math.abs(x)<1e-9?1:Math.pow(Math.sin(x)/x,2);
    const X=px+i/120*pw,Y=py+ph-pm*ph;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.stroke();
  const dT=(tempVal-50)*0.36,xm=dT*0.30,pmv=Math.abs(xm)<1e-9?1:Math.pow(Math.sin(xm)/xm,2);
  const mx=px+(dT+18)/36*pw;
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(px+pw/2,py);ctx.lineTo(px+pw/2,py+ph);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#ffdf3f';ctx.beginPath();ctx.arc(mx,py+ph-pmv*ph,4,0,7);ctx.fill();
  label('ΔT = '+(dT>=0?'+':'')+dT.toFixed(1)+' °C · эффективность '+Math.round(pmv*100)+'%',
        330,496,pmv>0.5?'#7dffa9':'#ff8a70','11px system-ui');
}
function drawAlignPanel(){
  panel(316,534,284,154);
  label('Юстировка — перетаскивайте мышью',330,554,'#cfdaf0','12px system-ui');
  bar2(330,566,160,etaCoup(),'согласование накачки (линза)','#b48cff',Math.round(etaCoup()*100)+'%');
  bar2(330,600,160,etaKtp(),'перекрытие моды в KTP','#ff9ecf',Math.round(etaKtp()*100)+'%');
  label('добавочные потери δ_юст = '+dAlign().toFixed(3),330,648,
        dAlign()>0.02?'#ff8a70':'#9fb2d4','11px system-ui');
  label('двойной клик по схеме — сброс смещений',330,668,'#5a6c8f','10px system-ui');
}
function plotG(px,py,pw,ph,get,norm,col){
  if(samples.length<2)return;
  const tw=graphWindow(),t0=t-tw;
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.beginPath();
  let first=true;
  for(const s of samples){
    if(s.t<t0)continue;
    const x=px+(s.t-t0)/tw*pw;
    const v=Math.max(0,Math.min(1,norm(get(s))));
    const y=py+ph-v*ph;
    first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false;
  }
  ctx.stroke();
}
function drawG1(){
  panel(616,360,544,150);
  label('Заселенность N₂(t) относительно порога',630,380,'#cfdaf0','12px system-ui');
  const px=630,py=392,pw=516,ph=100;
  let ymax=1.6;for(const s of samples)ymax=Math.max(ymax,s.n2/N2_th*1.1);
  ctx.strokeStyle='#22304a';
  for(let i=0;i<=3;i++){const y=py+ph*i/3;
    ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px+pw,y);ctx.stroke();}
  const ythr=py+ph-(1/ymax)*ph;
  ctx.strokeStyle='rgba(255,80,80,.6)';ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(px,ythr);ctx.lineTo(px+pw,ythr);ctx.stroke();ctx.setLineDash([]);
  label('порог',px+pw-34,ythr-4,'#ff8080','10px system-ui');
  plotG(px,py,pw,ph,s=>s.n2/N2_th,v=>v/ymax,'#79f279');
  label(fmt(graphWindow(),'с'),px+pw-52,py+ph+12,'#5a6c8f','10px system-ui');
}
function drawG2(){
  panel(616,524,544,164);
  label('Мощности (лог. шкала): циркулирующая 1064 нм и выход 532 нм',630,544,'#cfdaf0','12px system-ui');
  const px=630,py=556,pw=516,ph=100;
  let pmax=1e-2;for(const s of samples)pmax=Math.max(pmax,s.pg,s.pc);
  const lmin=-4,lmax=Math.max(-1,Math.log10(pmax*3));
  const norm=v=>(Math.log10(Math.max(v,Math.pow(10,lmin)))-lmin)/(lmax-lmin);
  ctx.strokeStyle='#22304a';
  for(let e=Math.ceil(lmin);e<=Math.floor(lmax);e++){
    const y=py+ph-(e-lmin)/(lmax-lmin)*ph;
    ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px+pw,y);ctx.stroke();
    label('10^'+e,px+2,y-2,'#5a6c8f','9px system-ui');}
  plotG(px,py,pw,ph,s=>s.pc,norm,'#ff5050');
  plotG(px,py,pw,ph,s=>s.pg,norm,'#52ff7d');
  ctx.fillStyle='#ff5050';ctx.fillRect(px+8,py+ph+8,14,3);
  label('P циркулирующая 1064',px+26,py+ph+12,'#9fb2d4','10px system-ui');
  ctx.fillStyle='#52ff7d';ctx.fillRect(px+210,py+ph+8,14,3);
  label('P выхода 532',px+228,py+ph+12,'#9fb2d4','10px system-ui');
  label(fmt(graphWindow(),'с'),px+pw-52,py+ph+12,'#5a6c8f','10px system-ui');
}
function draw(){
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  drawBench();drawIRGlow();drawLD();drawPumpRays();drawLens();
  drawNd();drawKTP();drawQS();drawMirrors();drawFilter();drawOutput();
  drawLevels();drawPM();drawAlignPanel();drawG1();drawG2();
}
/* ---------- инфопанель ---------- */
const info=document.getElementById('info');
function updateInfo(){
  const P_th_eff=P_th0/Math.max(etaCoup(),1e-6);
  let h=`
  <span>Накачка: <b>${fmt(Ppump,'Вт')}</b> = <b>${(Ppump/Math.max(P_th_eff,1e-12)).toFixed(2)}×</b> порога</span>
  <span>Порог (с юстировкой): <b>${fmt(P_th_eff,'Вт')}</b></span>
  <span>N₂: <b>${fmt(n2,'м⁻³')}</b>, N₂/N_th: <b>${(n2/N2_th).toFixed(2)}</b></span>
  <span>Φ(1064): <b>${phi.toExponential(2)}</b></span>
  <span>τ_c: <b>${fmt(t_rt/curDelta(),'с')}</b></span>
  <span>P циркулирующая 1064: <b>${fmt(Pcirc(),'Вт')}</b></span>
  <span>P вых. 532: <b>${fmt(avgPG,'Вт')}</b></span>
  <span>КПД 808→532: <b>${(100*avgPG/Math.max(Ppump,1e-9)).toFixed(1)}%</b> (Стокс-предел 66%)</span>`;
  if(mode==='qswitch'){
    h+=`<span>Импульсов: <b>${pulseCount}</b></span>`;
    if(lastPulse)h+=`
    <span>Энергия зел. импульса: <b>${fmt(lastPulse.E,'Д')}</b></span>
    <span>Пик P₅₃₂: <b>${fmt(lastPulse.peak,'Вт')}</b></span>
    <span>FWHM: <b>${lastPulse.fwhm?fmt(lastPulse.fwhm,'с'):'—'}</b></span>
    <span>Средняя P₅₃₂ (послед.): <b>${fmt(totalE/Math.max(t,1e-9)*rep,'Вт')}</b></span>`;
  }
  h+=`<span class="sub">dN₂/dt = R_p·η − N₂/τ_f − G·N₂·Φ/V_g;   dΦ/dt = [G·N₂ − 1/τ_c(t)]·Φ − κ·Φ² + β·N₂V_g/τ_f;
  P₅₃₂ = (κΦ²/2)·hν_g·η_g;   κ = κ₀·sinc²(ΔkL/2)·η_KTP;   τ_c = t_rt/[δ_pass + δ_юст + δ_QS(t)]</span>`;
  info.innerHTML=h;
}
/* ---------- мышь: юстировка ---------- */
function evtPos(e){const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  const p=evtPos(e);
  for(const it of[lens,ktpE]){
    if(p.x>=it.x0&&p.x<=it.x1&&Math.abs(p.y-(AXIS+it.off))<=it.half){
      dragIt=it;it.grab=p.y-(AXIS+it.off);
      cv.setPointerCapture(e.pointerId);break;
    }
  }
});
cv.addEventListener('pointermove',e=>{
  const p=evtPos(e);
  if(dragIt){dragIt.off=Math.max(-55,Math.min(55,p.y-dragIt.grab-AXIS));return;}
  hoverIt=null;
  for(const it of[lens,ktpE])
    if(p.x>=it.x0&&p.x<=it.x1&&Math.abs(p.y-(AXIS+it.off))<=it.half)hoverIt=it;
  cv.style.cursor=hoverIt?'grab':'default';
});
addEventListener('pointerup',()=>{dragIt=null;});
cv.addEventListener('dblclick',()=>{lens.off=0;ktpE.off=0;});
/* ---------- управление ---------- */
const $=id=>document.getElementById(id);
$('pump').oninput=e=>{Ppump=+e.target.value/1000;
  $('pv').textContent=e.target.value+' мВт';};
$('mode').onchange=e=>{mode=e.target.value;
  $('replab').style.display=mode==='qswitch'?'flex':'none';reset();};
$('rep').oninput=e=>{rep=+e.target.value;$('repv').textContent=rep+' Гц';};
$('temp').oninput=e=>{tempVal=+e.target.value;};
$('fire').onclick=()=>{if(mode==='qswitch'&&switchClosed)manualFire=true;};
$('slowmo').onchange=e=>autoSlow=e.target.checked;
$('align').onclick=()=>{lens.off=0;ktpE.off=0;};
$('pause').onclick=function(){paused=!paused;this.textContent=paused?'Продолжить':'Пауза';};
$('reset').onclick=reset;
$('pv').textContent='250 мВт';$('repv').textContent=rep+' Гц';

/* ---------- главный цикл ---------- */
reset();
(function frame(){
  if(!paused){
    const sp=+$('speed').value/100;
    const base=Math.pow(10,-6.8+sp*4.6);
    pulseActive=(phi>1e10||Pgreen()>0.5);
    let target=base;
    if(autoSlow){
      if(pulseActive)target=SLOW_SIM;
      else if(t<slowmoUntil)target=Math.max(SLOW_SIM*20,base*0.02);
    }
    curSpeed+=(target-curSpeed)*(target<curSpeed?0.5:0.12);
    t_sample=graphWindow()/400;
    advance(curSpeed);
  }
  draw();updateInfo();
  requestAnimationFrame(frame);
})();
</script>
