<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Количественная модель лазера: скоростные уравнения + Q-switching</title>
<style>
  html,body{background:#0b0d12;color:#dfe6f3;font-family:system-ui,Segoe UI,Arial;margin:0;padding:12px}
  h2{text-align:center;font-weight:600;margin:2px 0 8px}
  .controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
  .controls label{display:flex;align-items:center;gap:5px}
  canvas{display:block;margin:0 auto;background:#05060a;border:1px solid #223;border-radius:10px}
  button,select{background:#1c2333;color:#dfe6f3;border:1px solid #35405a;border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer}
  button:hover{background:#27304a}
  #fire{background:#3a1c1c;border-color:#7a3030;color:#ffd0c0}
  #info{max-width:1150px;margin:8px auto 0;font-size:13px;line-height:1.5;color:#b9c6de;
        display:grid;grid-template-columns:repeat(4,1fr);gap:4px 18px}
  #info b{color:#eef3ff}
  .sub{grid-column:1/-1;color:#7f90ad;font-size:12px;border-top:1px solid #223;padding-top:4px}
</style>
</head>
<body>
<h2>Скоростные уравнения лазера · реальная динамика генерации · модуляция добротности</h2>
<div class="controls">
  <label>Среда: <select id="mat">
    <option value="ndyag">Nd:YAG (4 уровня, 1064 нм)</option>
    <option value="ruby">Рубин (3 уровня, 694 нм)</option>
  </select></label>
  <label>Режим: <select id="mode">
    <option value="qswitch">Q-switching (гигантские импульсы)</option>
    <option value="cw">Непрерывный (CW)</option>
  </select></label>
  <label>Накачка <input id="pump" type="range" min="0" max="300" value="130" step="1"><span id="pv"></span></label>
  <label>R₂ <input id="r2" type="range" min="50" max="99" value="88" step="1"><span id="r2v"></span></label>
  <label id="replab">Частота затвора <input id="rep" type="range" min="1" max="2000" value="500" step="1"><span id="repv"></span></label>
  <button id="fire">Огнь (открыть затвор)</button>
  <label>Скорость <input id="speed" type="range" min="0" max="100" value="45"></label>
  <label><input id="slowmo" type="checkbox" checked> замедление на импульсе</label>
  <button id="pause">Пауза</button>
  <button id="reset">Сброс</button>
</div>
<canvas id="c" width="1150" height="640"></canvas>
<div id="info"></div>

<script>
'use strict';
/* =====================================================================
   КОЛИЧЕСТВЕННАЯ МОДЕЛЬ ЛАЗЕРА
   dN2/dt = Rp - N2/τf - σ·(c/n)·(Φ/Vc)·ΔN
   dΦ/dt  = [(Lg/Lc)·σ·(c/n)·ΔN - 1/τc(t)]·Φ + β·N2·Vg/τf
   ΔN(4-уровн.) = N2 ;  ΔN(3-уровн.) = 2N2 - Ntot
   τc(t) = t_rt / [ 2αLg + ln(1/R1R2) + δ_QS(t) ]   <- модуляция добротности
   P_out = Φ·hν·ln(1/R2)/t_rt
   Интегрирование: РК4 с адаптивным шагом, шаг согласован с моментами
   переключения затвора (разрыв τc обрабатывается точно).
   ===================================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const hP=6.62607015e-34,cL=2.99792458e8;

/* ---------- реальные параметры активных сред ---------- */
const MATERIALS={
  ndyag:{name:'Nd:YAG',type:'four',
    N_total:1.0e26,   // м^-3  (~1e20 см^-3, Nd 1 at.%)
    tau_f:230e-6,     // с     время жизни верхнего уровня
    sigma:2.8e-23,    // м^2   сечение вынужденного излучения (2.8e-19 см^2)
    lam_l:1064e-9,lam_p:808e-9,n:1.82,alpha:0.5,beta:1e-5,
    col:'#ff5050',colDim:'#7a2020'},
  ruby:{name:'Рубин',type:'three',
    N_total:1.6e25,   // м^-3  (~1.6e19 см^-3, Cr 0.05%)
    tau_f:3e-3,       // с
    sigma:3.5e-24,    // м^2   (3.5e-20 см^2)
    lam_l:694e-9,lam_p:550e-9,n:1.76,alpha:0.5,beta:1e-5,
    col:'#ff2020',colDim:'#701515'}
};
/* ---------- геометрия резонатора ---------- */
const GEO={L_g:0.10,L_c:0.30,A:2.0e-5,R1:0.999};
const deltaQS=4.0;          // потери закрытого затвора (условный AOM/EO-ячейка)
const t_open=1.0e-5;        // длительность открытого состояния затвора, с
const SLOWMO_T=2.0e-8;      // шаг модели на кадр в замедлении (20 нс/кадр)
const SLOWMO_WIN=8e-6;      // окно замедления после открытия затвора
const PULSE_TRIG=1e3,MIN_DUR=1e-7;

/* ---------- состояние ---------- */
let mat=MATERIALS.ndyag,mode='qswitch';
let R2=0.88,Ppump=130,rep=500,eta=0.8;
let hvl,hvp,c_n,t_rt,Vg,Vc,f_fill,deltaPass,deltaOC;
let N2_th,dN_th,P_th;
let n2=0,phi=0,t=0;
let switchClosed=true,tOpened=0,tLastOpen=0,manualFire=false,slowmoUntil=-1;
let Wp0=0,avgP=0,pulseCap=null,lastPulse=null,pulseCount=0,totalE=0;
let samples=[],nextSampleT=0,t_sample=1e-6,curSpeed=1e-5;
let paused=false,autoSlow=true;
const MAX_STEPS=8000;

/* ---------- производные величины и пороги ---------- */
function recompute(){
  hvl=hP*cL/mat.lam_l; hvp=hP*cL/mat.lam_p;
  c_n=cL/mat.n;
  t_rt=2*(GEO.L_c+(mat.n-1)*GEO.L_g)/cL;
  Vg=GEO.A*GEO.L_g; Vc=GEO.A*GEO.L_c; f_fill=GEO.L_g/GEO.L_c;
  deltaPass=2*mat.alpha*GEO.L_g+Math.log(1/(GEO.R1*R2));
  deltaOC=Math.log(1/R2);
  const g_th=mat.alpha+Math.log(1/Math.sqrt(GEO.R1*R2))/GEO.L_g;
  dN_th=g_th/mat.sigma;
  N2_th=(mat.type==='four')?dN_th:(mat.N_total+dN_th)/2;
  if(mat.type==='four'){
    P_th=(N2_th/mat.tau_f)*hvp*Vg/eta;
  }else{
    const N1=mat.N_total-N2_th;
    P_th=((N2_th/mat.tau_f)*(mat.N_total/Math.max(N1,1)))*hvp*Vg/eta;
  }
  Wp0=eta*Ppump/(hvp*Vg);
}
const invD=()=>mat.type==='three'?2*n2-mat.N_total:n2;
const curDelta=()=>deltaPass+((mode==='qswitch'&&switchClosed)?deltaQS:0);
const Pout=()=>phi*hvl*deltaOC/t_rt;

/* ---------- правая часть системы ---------- */
function deriv(n2v,phiv){
  const N1=(mat.type==='three')?Math.max(0,mat.N_total-n2v):0;
  const dN=(mat.type==='three')?2*n2v-mat.N_total:n2v;
  const pump=(mat.type==='four')?Wp0:Wp0*N1/mat.N_total;
  const stim=mat.sigma*c_n*(phiv/Vc)*dN;
  const dn2=pump-n2v/mat.tau_f-stim;
  const tau_c=t_rt/curDelta();
  const growth=f_fill*mat.sigma*c_n*dN;
  const Ssp=mat.beta*(n2v*Vg)/mat.tau_f;
  const dphi=(growth-1/tau_c)*phiv+Ssp;
  return[dn2,dphi];
}
/* ---------- адаптивный шаг ---------- */
function chooseDt(){
  const tau_c=t_rt/curDelta();
  const g=Math.max(0,f_fill*mat.sigma*c_n*invD());
  let dt=0.25*tau_c;
  if(g>0)dt=Math.min(dt,0.15/g);
  dt=Math.min(dt,0.05*mat.tau_f,1e-6);
  return Math.max(dt,1e-13);
}
function nextEvent(){
  if(mode!=='qswitch')return null;
  return switchClosed?(tLastOpen+1/rep):(tOpened+t_open);
}
/* ---------- Q-затвор ---------- */
function updateQS(){
  if(mode!=='qswitch'){switchClosed=false;return;}
  if(switchClosed){
    if(manualFire||(t-tLastOpen)>=1/rep){
      switchClosed=false;tOpened=t;manualFire=false;
      if(autoSlow)slowmoUntil=t+SLOWMO_WIN;
    }
  }else if(t-tOpened>=t_open){switchClosed=true;tLastOpen=t;}
}
/* ---------- захват импульса и метрики ---------- */
function detectPulse(){
  if(mode!=='qswitch')return;
  const P=Pout();
  if(!pulseCap&&P>PULSE_TRIG)pulseCap={t0:t,E:0,peak:0,lastP:P,lastT:t,s:[]};
  if(pulseCap){
    pulseCap.E+=0.5*(P+pulseCap.lastP)*(t-pulseCap.lastT);
    pulseCap.lastP=P;pulseCap.lastT=t;
    if(P>pulseCap.peak)pulseCap.peak=P;
    pulseCap.s.push([t,P]);if(pulseCap.s.length>4000)pulseCap.s.shift();
    if(P<PULSE_TRIG&&t-pulseCap.t0>MIN_DUR){
      const half=pulseCap.peak/2;let a=null,b=null;
      for(const[x,y]of pulseCap.s){if(y>=half){if(a===null)a=x;b=x;}}
      lastPulse={E:pulseCap.E,peak:pulseCap.peak,fwhm:(a!==null?b-a:null),t0:pulseCap.t0};
      pulseCount++;totalE+=pulseCap.E;pulseCap=null;
    }
  }
}
/* ---------- главный интегрирующий цикл ---------- */
function advance(dur){
  const tEnd=t+dur;let steps=0;
  while(t<tEnd&&steps<MAX_STEPS){
    updateQS();
    let dt=chooseDt();
    const ev=nextEvent();
    if(ev!==null&&ev<tEnd&&ev-t>1e-14)dt=Math.min(dt,ev-t);
    dt=Math.min(dt,tEnd-t);if(dt<=0)dt=1e-13;
    const k1=deriv(n2,phi);
    const k2=deriv(n2+.5*dt*k1[0],phi+.5*dt*k1[1]);
    const k3=deriv(n2+.5*dt*k2[0],phi+.5*dt*k2[1]);
    const k4=deriv(n2+dt*k3[0],phi+dt*k3[1]);
    n2+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
    phi+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    if(n2<0)n2=0;if(n2>mat.N_total)n2=mat.N_total;if(phi<0)phi=0;
    avgP+=(Pout()-avgP)*(dt/1e-3);
    t+=dt;steps++;
    if(t>=nextSampleT){
      samples.push({t,n2,P:Pout()});nextSampleT+=t_sample;
      const win=graphWindow();
      while(samples.length&&samples[0].t<t-win)samples.shift();
    }
    detectPulse();
  }
}
const graphWindow=()=>mode==='qswitch'?Math.max(3/rep,5e-5):Math.min(8*mat.tau_f,0.02);

/* ---------- сброс ---------- */
function reset(){
  recompute();
  n2=(mat.type==='three'?mat.N_total*0.999:0);phi=0;t=0;avgP=0;
  switchClosed=true;tOpened=0;manualFire=false;slowmoUntil=-1;
  pulseCap=null;lastPulse=null;pulseCount=0;totalE=0;
  samples=[];nextSampleT=0;
  tLastOpen=2*mat.tau_f-1/rep;   // первый импульс после ~2τf накачки
}

/* ================= ОТРИСОВКА ================= */
function fmt(x,u){
  if(!isFinite(x)||x===0)return'0 '+u;
  const a=Math.abs(x),p=[['T',1e12],['G',1e9],['M',1e6],['k',1e3],['',1],['m',1e-3],['µ',1e-6],['n',1e-9],['p',1e-12]];
  for(const[q,f]of p)if(a>=f)return(x/f).toPrecision(3)+' '+q+u;
  return(x*1e15).toPrecision(3)+' f'+u;
}
function panel(x,y,w,h){ctx.fillStyle='rgba(20,26,40,.75)';ctx.strokeStyle='#2c3a55';
  ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();}
function txt(s,x,y,c='#93a5c6',f='12px system-ui'){ctx.fillStyle=c;ctx.font=f;ctx.fillText(s,x,y);}

/* --- схема уровней и заселенности --- */
function drawLevels(){
  panel(16,36,300,280);
  txt('Уровни энергии — '+mat.name,32,60,'#cfdaf0','13px system-ui');
  const lv=mat.type==='four'
    ?[{lab:'E3 · накачка',y:100},{lab:'E2 · верхний лазерный',y:160},{lab:'E1 · нижний (быстрый уход)',y:235},{lab:'E0 · основной',y:290}]
    :[{lab:'E3 · накачка',y:100},{lab:'E2 · метастабильный',y:170},{lab:'E1 · основной (= нижний)',y:290}];
  const x0=32,x1=250,exc=n2/mat.N_total;
  for(const L of lv){ctx.strokeStyle='#5a6c8f';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x0,L.y);ctx.lineTo(x1,L.y);ctx.stroke();
    txt(L.lab,x0,L.y-7,'#93a5c6','11px system-ui');}
  // заселенность E2 и нижнего
  const e2y=lv[1].y, gy=lv[lv.length-1].y;
  ctx.fillStyle='rgba(121,242,121,.85)';ctx.fillRect(x0,e2y-4,(x1-x0)*exc,4);
  const gf=(mat.type==='four')?Math.max(0,1-exc):Math.max(0,1-exc);
  ctx.fillStyle='rgba(143,180,232,.85)';ctx.fillRect(x0,gy-4,(x1-x0)*gf,4);
  txt('N₂ = '+fmt(n2,'м⁻³'),258,e2y+3,'#79f279','11px system-ui');
  txt('N₂/N₂ᵗᵍ = '+(n2/N2_th).toFixed(2),32,312,n2>=N2_th?'#5dff7f':'#ffb14a','12px system-ui');
  txt('ΔN/ΔNᵗᵍ = '+(invD()/dN_th).toFixed(2),170,312,invD()>=dN_th?'#5dff7f':'#ffb14a','12px system-ui');
}
/* --- резонатор, среда, затвор, пучок --- */
function drawCavity(){
  panel(336,36,800,280);
  const mx0=360,mx1=560,my0=140,my1=260;       // активный элемент
  const hx=352,ox=1112,cy=200;                 // зеркала
  // зеркала
  ctx.fillStyle='#cdd9ee';ctx.fillRect(hx,my0-20,8,my1-my0+40);
  ctx.fillStyle='rgba(205,217,238,.5)';ctx.fillRect(ox,my0-20,8,my1-my0+40);
  txt('R₁≈100%',hx-12,my0-28);txt('R₂='+Math.round(R2*100)+'%',ox-20,my0-28);
  // активный элемент
  const inv=Math.max(0,invD()/mat.N_total);
  ctx.fillStyle=`rgba(${mat.type==='four'?'40,150,60':'150,60,40'},${0.15+0.5*Math.max(0,n2/mat.N_total)})`;
  ctx.fillRect(mx0,my0,mx1-mx0,my1-my0);
  ctx.strokeStyle='#3a4a6a';ctx.strokeRect(mx0,my0,mx1-mx0,my1-my0);
  txt('активная среда '+mat.name,mx0,my1+18);
  // атомы в среде
  const NA=96,frac=Math.max(0,Math.min(1,n2/mat.N_total));
  for(let i=0;i<NA;i++){
    const ax=mx0+8+(i%16)*((mx1-mx0-16)/15),ay=my0+8+((i/16)|0)*((my1-my0-16)/5);
    ctx.fillStyle=((i+0.5)/NA<frac)?'#79f279':'#67809f';
    ctx.beginPath();ctx.arc(ax,ay,3,0,7);ctx.fill();
  }
  // Q-затвор
  const qx=640,qw=34;
  const closed=(mode==='qswitch'&&switchClosed);
  ctx.fillStyle=closed?'rgba(255,90,60,.85)':'rgba(90,220,140,.35)';
  ctx.fillRect(qx,my0+10,qw,my1-my0-20);
  ctx.strokeStyle='#4a5a7a';ctx.strokeRect(qx,my0+10,qw,my1-my0-20);
  txt('Q-затвор',qx-8,my1+18);
  txt(closed?'ЗАКРЫТ (δ_QS велика)':'ОТКРЫТ',qx-8,my0-6,closed?'#ff8a70':'#7dffa9','11px system-ui');
  // внутрирезонаторное поле
  const lp=Math.max(0,Math.min(1,Math.log10(phi+1)/15));
  if(lp>0.02){
    const g=ctx.createLinearGradient(0,my0,0,my1);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,hexA(mat.col,0.55*lp));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(hx+8,cy-40,ox-hx-8,80);
  }
  // бегущие фотоны (число ~ log Φ)
  const nph=Math.round(lp*26);
  ctx.lineCap='round';
  for(let i=0;i<nph;i++){
    const ph=(t*3e8*0.02+i*0.37)%1,xx=hx+12+ph*(ox-hx-20),dir=(i%2)?1:-1;
    ctx.strokeStyle=hexA(mat.col,.9);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(xx,cy+((i*53)%56)-28);ctx.lineTo(xx-dir*7,cy+((i*53)%56)-28);ctx.stroke();
  }
  // выходной пучок
  const bp=Math.max(0,Math.min(1,Math.log10(Pout()+1)/9));
  if(bp>0.02){
    const g=ctx.createLinearGradient(ox+8,0,W-16,0);
    g.addColorStop(0,hexA(mat.col,.85*bp));g.addColorStop(1,'rgba(0,0,0,0)');
    const bh=3+34*bp;
    ctx.fillStyle=g;ctx.fillRect(ox+8,cy-bh/2,W-16-(ox+8),bh);
  }
  txt('P_out = '+fmt(Pout(),'Вт'),ox-150,my1+18,'#ffb0a0');
  txt('Φ = '+(phi.toExponential(2))+' фотонов',640,my1+18,'#9fb2d4','11px system-ui');
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;}
/* --- графики --- */
function drawGraph(gx,gy,gw,gh,getKey,label,color,thr){
  panel(gx-12,gy-24,gw+24,gh+36);
  txt(label,gx,gy-8,'#cfdaf0','12px system-ui');
  ctx.strokeStyle='#22304a';
  for(let i=0;i<=3;i++){const y=gy+gh*i/3;ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx+gw,y);ctx.stroke();}
  if(samples.length<2)return;
  const t0=t-graphWindow(),t1=t;
  const X=tt=>gx+(tt-t0)/(t1-t0)*gw;
  let ymax=getKey(samples[0]);for(const s of samples)ymax=Math.max(ymax,getKey(s));
  ymax=Math.max(ymax*1.15,thr?thr*1.3:1e-9);
  const Y=v=>gy+gh-Math.min(1,v/ymax)*gh;
  ctx.strokeStyle=color;ctx.lineWidth=1.7;ctx.beginPath();
  let first=true;
  for(const s of samples){if(s.t<t0)continue;const x=X(s.t),y=Y(getKey(s));
    first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false;}
  ctx.stroke();
  if(thr){ctx.strokeStyle='rgba(255,80,80,.6)';ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(gx,Y(thr));ctx.lineTo(gx+gw,Y(thr));ctx.stroke();ctx.setLineDash([]);
    txt('порог',gx+gw-34,Y(thr)-4,'#ff8080','10px system-ui');}
  txt(fmt(ymax,'').trim(),gx+2,gy+10,'#5a6c8f','10px system-ui');
  txt(fmt(t1-t0,'с'),gx+gw-46,gy+gh+11,'#5a6c8f','10px system-ui');
}
function drawGraphLogP(gx,gy,gw,gh){
  panel(gx-12,gy-24,gw+24,gh+36);
  txt('Выходная мощность P_out(t), лог. масштаб',gx,gy-8,'#cfdaf0','12px system-ui');
  if(samples.length<2)return;
  const t0=t-graphWindow(),t1=t,X=tt=>gx+(tt-t0)/(t1-t0)*gw;
  let pmax=1;for(const s of samples)pmax=Math.max(pmax,s.P);
  const pmin=1e-3,lpmax=Math.log10(pmax*1.2),lpmin=Math.log10(pmin);
  const Y=p=>gy+gh-(Math.max(lpmin,Math.log10(Math.max(p,pmin)))-lpmin)/(lpmax-lpmin)*gh;
  ctx.strokeStyle='#22304a';
  for(let e=Math.ceil(lpmin);e<=Math.floor(lpmax);e++){const y=Y(Math.pow(10,e));
    ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx+gw,y);ctx.stroke();
    txt('10^'+e,gx+2,y-2,'#5a6c8f','9px system-ui');}
  ctx.strokeStyle='#ffb14a';ctx.lineWidth=1.7;ctx.beginPath();
  let first=true;
  for(const s of samples){if(s.t<t0)continue;const x=X(s.t),y=Y(s.P);
    first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false;}
  ctx.stroke();
  txt(fmt(t1-t0,'с'),gx+gw-46,gy+gh+11,'#5a6c8f','10px system-ui');
}
function draw(){
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  drawLevels();drawCavity();
  drawGraph(336,376,800,110,s=>s.n2,'Заселенность верхнего уровня N₂(t)',
            mat.type==='four'?'#79f279':'#79f279',N2_th);
  drawGraphLogP(336,540,800,86);
}
/* ---------- инфопанель ---------- */
const info=document.getElementById('info');
function updateInfo(){
  const st=mode==='qswitch'?(switchClosed?'закрыт':'ОТКРЫТ'):'—';
  let h=`<span>Среда: <b>${mat.name}</b> (${mat.type==='four'?'4':'3'}-уровн.)</span>
  <span>Накачка: <b>${fmt(Ppump,'Вт')}</b> = <b>${(Ppump/Math.max(P_th,1e-9)).toFixed(2)}×</b> порога</span>
  <span>Порог: <b>${fmt(P_th,'Вт')}</b></span>
  <span>τ_c: <b>${fmt(t_rt/curDelta(),'с')}</b></span>
  <span>N₂: <b>${fmt(n2,'м⁻³')}</b></span>
  <span>Инверсия ΔN: <b>${fmt(invD(),'м⁻³')}</b></span>
  <span>Запас. энергия: <b>${fmt(n2*Vg*hvl,'Д')}</b></span>
  <span>Φ: <b>${phi.toExponential(2)}</b></span>
  <span>P_out (мгнов.): <b>${fmt(Pout(),'Вт')}</b></span>
  <span>P_out (средн.): <b>${fmt(avgP,'Вт')}</b></span>
  <span>Q-затвор: <b>${st}</b></span>
  <span>Импульсов: <b>${pulseCount}</b></span>`;
  if(lastPulse)h+=`<span>Энергия импульса: <b>${fmt(lastPulse.E,'Д')}</b></span>
  <span>Пик. мощность: <b>${fmt(lastPulse.peak,'Вт')}</b></span>
  <span>Длит. (FWHM): <b>${lastPulse.fwhm?fmt(lastPulse.fwhm,'с'):'—'}</b></span>
  <span>Средн. мощн. послед.: <b>${fmt(totalE*Math.min(rep,1e9)* (mode==='qswitch'?1:0),'Вт')}</b></span>`;
  h+=`<span class="sub">Модель: скоростные уравнения, РК4, адаптивный шаг; параметры σ, τ_f — табличные. Время на графиках — модельное (реальное). 1064 нм показан красным для наглядности.</span>`;
  info.innerHTML=h;
}
/* ---------- управление ---------- */
const $=id=>document.getElementById(id);
$('mat').onchange=e=>{mat=MATERIALS[e.target.value];reset();};
$('mode').onchange=e=>{mode=e.target.value;$('replab').style.display=mode==='qswitch'?'flex':'none';reset();};
$('pump').oninput=e=>{Ppump=+e.target.value;recompute();$('pv').textContent=Ppump+' Вт';};
$('r2').oninput=e=>{R2=+e.target.value/100;recompute();$('r2v').textContent=Math.round(R2*100)+'%';};
$('rep').oninput=e=>{rep=+e.target.value;$('repv').textContent=rep+' Гц';};
$('fire').onclick=()=>{if(mode==='qswitch'&&switchClosed)manualFire=true;};
$('slowmo').onchange=e=>autoSlow=e.target.checked;
$('pause').onclick=function(){paused=!paused;this.textContent=paused?'Продолжить':'Пауза';};
$('reset').onclick=reset;
$('pv').textContent=Ppump+' Вт';$('r2v').textContent=Math.round(R2*100)+'%';$('repv').textContent=rep+' Гц';

/* ---------- главный цикл ---------- */
reset();
(function frame(){
  if(!paused){
    const sp=+$('speed').value/100;
    const base=Math.pow(10,-6.7+sp*4.4);            // 0.2 мкс/кадр … 5 мс/кадр
    const target=(autoSlow&&t<slowmoUntil)?SLOWMO_T:base;
    curSpeed+=(target-curSpeed)*0.15;
    t_sample=graphWindow()/500;
    advance(curSpeed);
  }
  draw();updateInfo();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
